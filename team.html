<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PonyOni — Команда</title>
  
  <link rel="icon" type="image/png" href="image/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      color: #2b2b36;
      background: #1b1a2e;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ФИКСИРОВАННАЯ ШАПКА */
    .global-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      z-index: 100;
      background: rgba(27, 26, 46, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-container {
      width: 100%;
      max-width: 1140px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    .logo img { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; }
    
    .nav-menu {
      display: flex;
      gap: 28px;
      list-style: none;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 10px 28px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .nav-menu a {
      color: #e2d7f5;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: color 0.2s;
    }
    .nav-menu a:hover, .nav-menu a.active { color: #ffffff; font-weight: 700; }

    /* ПОЛНОЭКРАННЫЕ БЛОКИ (Full-page Scroll) */
    .full-screen-section {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 40px 40px 40px;
      position: relative;
      overflow: hidden;
    }

    /* ФОНОВЫЙ АРТ НА ВЕСЬ ЭКРАН */
    .bg-character-art {
      position: absolute;
      top: 0;
      right: 0;
      width: 55%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0.35;
      mask-image: linear-gradient(to left, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* ОГРОМНЫЙ НИКНЕЙМ НА ЗАДНЕМ ФОНЕ НА ВСЕХ ЭКРАН */
    .bg-watermark-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Poppins', sans-serif;
      font-size: 13vw;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.035);
      white-space: nowrap;
      z-index: 0;
      pointer-events: none;
      user-select: none;
      text-transform: uppercase;
    }

    .screen-container {
      width: 100%;
      max-width: 1140px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    /* КОНТЕНТ УЧАСТНИКА СЛЕВА */
    .member-info-box {
      max-width: 540px;
    }

    .poster-title-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .member-avatar-big {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .poster-title-wrap h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 40px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 15px rgba(0,0,0,0.3);
    }

    .role {
      font-size: 17px;
      font-weight: 600;
      color: #ffd1dc;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    .desc {
      font-size: 15px;
      color: #e2d7f5;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 28px; border-radius: 50px; font-weight: 600; font-size: 14px;
      text-decoration: none; cursor: pointer; border: none;
      background: linear-gradient(135deg, #a88beb 0%, #e87999 100%); color: #ffffff;
      box-shadow: 0 10px 25px rgba(168, 139, 235, 0.4);
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.25); }

    .scroll-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 13px; color: rgba(255, 255, 255, 0.6); font-weight: 500; animation: bounce 2s infinite; cursor: pointer; z-index: 5; }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) translateY(0);}
      40% {transform: translateX(-50%) translateY(-6px);}
      60% {transform: translateX(-50%) translateY(-3px);}
    }

    /* МОДАЛКА */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 14, 23, 0.7); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: #252336; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 32px; padding: 40px; max-width: 440px; width: 90%; text-align: center;
      color: #fff; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }
    .modal-card h3 { font-family: 'Poppins', sans-serif; font-size: 26px; margin-bottom: 14px; }
    .modal-card p { font-size: 15px; color: #d1b8ff; line-height: 1.6; margin-bottom: 30px; }
    .modal-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; }

    @media(max-width: 900px) {
      .nav-menu { display: none; }
      .full-screen-section { height: auto; min-height: 100vh; padding: 100px 20px 40px 20px; }
      .bg-character-art { width: 100%; opacity: 0.2; }
      .bg-watermark-text { font-size: 16vw; }
    }
  </style>
</head>
<body>

  <!-- ФИКСИРОВАННАЯ ШАПКА -->
  <header class="global-header">
    <div class="header-container">
      <a href="index.html#screen-intro" class="logo">
        <img src="image/logo.png" alt="Logo"> PonyOni 🎄
      </a>

      <ul class="nav-menu">
        <li><a href="index.html">Главная</a></li>
        <li><a href="team.html" class="active">Команда</a></li>
        <li><a href="index.html#screen-services">Услуги</a></li>
        <li><a href="index.html#screen-queue">Очередь</a></li>
        <li><a href="index.html#screen-reviews">Отзывы</a></li>
      </ul>

      <button class="btn" onclick="openModal()">Заказать</button>
    </div>
  </header>

  <!-- УЧАСТНИК 1: HONNILI -->
  <section id="member-1" class="full-screen-section">
    <div class="bg-character-art" style="background-image: url('image/HonArt1.png');"></div>
    <div class="bg-watermark-text">HonniLi</div>
